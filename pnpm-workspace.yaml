  - postcss-selector-parser@7.1.6
  - next@16.4.1
  - body-parser@2.4.0
  - undici@7.30.1

overrides:
  '@keystatic/core>js-yaml': 4.3.2
  'gray-matter>js-yaml': 3.15.2
  undici: ^7.30.0
  qs: ^6.16.0
  sharp: ^0.35.5
  'minimatch@8>brace-expansion': ^2.1.7
  'minimatch@10>brace-expansion': ^5.0.12
  chokidar: ^4.0.3
  katex: ^0.18.9
  postcss-selector-parser: ^7.1.6
  'glob@10': ^10.5.0
