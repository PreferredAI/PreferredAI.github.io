# Workflow to crawl publications weekly and update the site
name: Update Publications

on:
  # Run every Sunday at 00:00 UTC
  schedule:
    - cron: "0 0 * * 0"

  push:
    paths:
      - ".github/workflows/update-publications.yml"
      - "scripts/crawl-publications.ts"

  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run publications crawler
        run: pnpm crawl:publications

      - name: Format generated publication data
        run: pnpm exec biome check --write src/data/publications.ts

      - name: Lint application and generated data
        run: pnpm lint

      - name: Audit all dependencies
        run: pnpm audit:dependencies

      - name: Check for changes
        id: check-changes
        run: |
          git diff --quiet src/data/publications.ts || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.check-changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/publications.ts
          git commit -m "chore: update publications from hadylauw.com [automated]"
          git push

      - name: Trigger deploy workflow
        if: steps.check-changes.outputs.changed == 'true'
        run: |
          echo "Changes detected, deployment will be triggered by the push to main branch"
