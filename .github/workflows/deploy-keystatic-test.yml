name: Deploy Keystatic test Worker

on:
  push:
    branches: ["test-keystatic"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "keystatic-test-worker"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check Worker deployment credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_WORKERS_API_TOKEN as repository Actions secrets."
            exit 1
          fi

      - name: Check Keystatic GitHub configuration
        env:
          NEXT_PUBLIC_KEYSTATIC_STORAGE_KIND: ${{ vars.NEXT_PUBLIC_KEYSTATIC_STORAGE_KIND }}
          NEXT_PUBLIC_KEYSTATIC_GITHUB_APP_SLUG: ${{ vars.NEXT_PUBLIC_KEYSTATIC_GITHUB_APP_SLUG }}
          KEYSTATIC_GITHUB_CLIENT_ID: ${{ secrets.KEYSTATIC_GITHUB_CLIENT_ID }}
          KEYSTATIC_GITHUB_CLIENT_SECRET: ${{ secrets.KEYSTATIC_GITHUB_CLIENT_SECRET }}
          KEYSTATIC_SECRET: ${{ secrets.KEYSTATIC_SECRET }}
        run: |
          missing=0
          for name in \
            NEXT_PUBLIC_KEYSTATIC_STORAGE_KIND \
            NEXT_PUBLIC_KEYSTATIC_GITHUB_APP_SLUG \
            KEYSTATIC_GITHUB_CLIENT_ID \
            KEYSTATIC_GITHUB_CLIENT_SECRET \
            KEYSTATIC_SECRET
          do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing from the repository Actions variables or secrets."
              missing=1
            fi
          done
          exit "$missing"

      - name: Build and deploy test Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          NEXT_PUBLIC_KEYSTATIC_STORAGE_KIND: ${{ vars.NEXT_PUBLIC_KEYSTATIC_STORAGE_KIND }}
          KEYSTATIC_GITHUB_CLIENT_ID: ${{ secrets.KEYSTATIC_GITHUB_CLIENT_ID }}
          KEYSTATIC_GITHUB_CLIENT_SECRET: ${{ secrets.KEYSTATIC_GITHUB_CLIENT_SECRET }}
          KEYSTATIC_SECRET: ${{ secrets.KEYSTATIC_SECRET }}
          NEXT_PUBLIC_KEYSTATIC_GITHUB_APP_SLUG: ${{ vars.NEXT_PUBLIC_KEYSTATIC_GITHUB_APP_SLUG }}
        run: pnpm deploy:worker
