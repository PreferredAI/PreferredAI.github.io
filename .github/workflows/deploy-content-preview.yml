name: Deploy Keystatic content preview

on:
  workflow_run:
    workflows: ["Test website build"]
    types: [completed]

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: keystatic-preview-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  preview:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'push') &&
      startsWith(github.event.workflow_run.head_branch, 'keystatic/') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: content-preview
    env:
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Create repository-scoped publisher token (optional App)
        id: app-token
        if: vars.PREFERREDAI_AUTOMATION_APP_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PREFERREDAI_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.PREFERREDAI_AUTOMATION_APP_PRIVATE_KEY }}
          owner: PreferredAI
          repositories: PreferredAI.github.io
          permission-actions: read
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Resolve the matching open pull request
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pr_number=""
          for attempt in 1 2 3 4 5 6; do
            pr_number="$(gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --base "$BASE_BRANCH" \
              --head "$HEAD_BRANCH" \
              --json number,headRefOid \
              --jq ".[] | select(.headRefOid == \"$HEAD_SHA\") | .number" \
              | sed -n '1p')"
            if [[ -n "$pr_number" ]]; then
              break
            fi
            sleep 5
          done

          if [[ -z "$pr_number" ]]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Keystatic preview skipped"
              echo "No open pull request currently matches \`$HEAD_BRANCH\` at \`$HEAD_SHA\` (branch may have 0 commits ahead of \`$BASE_BRANCH\` or was superseded by a rebase/newer push)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Check out trusted publishing policy
        if: steps.pr.outputs.found == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: policy
          persist-credentials: false

      - name: Read complete pull request diff
        id: diff
        if: steps.pr.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          changed_files="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json changedFiles --jq '.changedFiles')"
          echo "changed_files=$changed_files" >> "$GITHUB_OUTPUT"
          gh api \
            --paginate \
            --slurp \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            > "$RUNNER_TEMP/keystatic-pr-files.json"

      - name: Reclassify editorial paths with trusted policy
        id: policy
        if: steps.pr.outputs.found == 'true'
        run: >-
          node policy/.github/scripts/classify-keystatic-changes.mjs
          --github-json "$RUNNER_TEMP/keystatic-pr-files.json"
          --expected-count "${{ steps.diff.outputs.changed_files }}"

      - name: Reject paths outside the editorial policy
        if: steps.pr.outputs.found == 'true' && steps.policy.outputs.eligible != 'true'
        env:
          INELIGIBLE_PATHS: ${{ steps.policy.outputs.ineligible_paths }}
        run: |
          echo "Preview rejected; ineligible paths: $INELIGIBLE_PATHS" >&2
          exit 1

      - name: Download validated static artifact
        if: steps.pr.outputs.found == 'true' && steps.policy.outputs.eligible == 'true'
        uses: actions/download-artifact@v8
        with:
          name: test-static-export
          path: preview
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Reject executable or invalid Pages artifacts
        if: steps.pr.outputs.found == 'true' && steps.policy.outputs.eligible == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f preview/index.html
          test -f preview/_headers
          test ! -e preview/_worker.js
          test ! -e preview/_routes.json
          test ! -d preview/functions
          test -z "$(find preview -type l -print -quit)"
          grep -Fq 'name="robots"' preview/index.html
          grep -Fq 'noindex' preview/index.html
          grep -Fq 'X-Robots-Tag: noindex, nofollow' preview/_headers
          file_count="$(find preview -type f | wc -l | tr -d ' ')"
          test "$file_count" -le 20000
          while IFS= read -r file; do
            size="$(stat -c '%s' "$file")"
            test "$size" -le 26214400
          done < <(find preview -type f)

      - name: Deploy isolated Pages preview
        id: pages
        if: steps.pr.outputs.found == 'true' && steps.policy.outputs.eligible == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          wranglerVersion: 4.124.0
          command: pages deploy ./preview --project-name=preferredai --branch=content-pr-${{ steps.pr.outputs.number }} --commit-hash=${{ github.event.workflow_run.head_sha }}

      - name: Verify Cloudflare Access protects preview
        if: steps.pr.outputs.found == 'true' && steps.policy.outputs.eligible == 'true'
        env:
          PREVIEW_URL: ${{ steps.pages.outputs.pages-deployment-alias-url || steps.pages.outputs.deployment-url }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$PREVIEW_URL")"
          case "$status" in
            302|401|403) ;;
            *) echo "Preview is not protected by Access (HTTP $status)." >&2; exit 1 ;;
          esac

      - name: Comment preview URL and approval policy
        if: steps.pr.outputs.found == 'true' && steps.policy.outputs.eligible == 'true'
        uses: actions/github-script@v9
        env:
          AUTO_MERGE_BLOG: ${{ steps.policy.outputs.auto_merge_blog }}
          HAS_PEOPLE: ${{ steps.policy.outputs.has_people }}
          PREVIEW_URL: ${{ steps.pages.outputs.pages-deployment-alias-url || steps.pages.outputs.deployment-url }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          script: |
            const marker = '<!-- preferredai-content-preview -->';
            const issue_number = Number(process.env.PR_NUMBER);
            let policyNote = '';
            if (process.env.AUTO_MERGE_BLOG === 'true') {
              policyNote = '\n\n✅ **Blog-only update verified:** Auto-approving and merging into `main` now.';
            } else if (process.env.HAS_PEOPLE === 'true') {
              policyNote = '\n\n👤 **People directory update:** Requires **1 maintainer approval** (@manhkhanhad) before squash-merging.';
            }
            const body = `${marker}\n🔒 Access-protected preview: ${process.env.PREVIEW_URL}${policyNote}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });
            const previous = comments.find((comment) => comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }

      - name: Checkout repository with deploy key for blog auto-merge
        if: steps.pr.outputs.found == 'true' && steps.policy.outputs.auto_merge_blog == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: merge-repo
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          fetch-depth: 0

      - name: Auto-approve and merge verified blog-only PR
        if: steps.pr.outputs.found == 'true' && steps.policy.outputs.auto_merge_blog == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr review "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --approve \
            --body "Automated verification and preview succeeded for blog-only editorial changes." || true

          git -C merge-repo fetch --prune origin
          current_branch_sha="$(git -C merge-repo rev-parse "origin/$HEAD_BRANCH")"
          if [[ "$current_branch_sha" != "$HEAD_SHA" ]]; then
            echo "Branch $HEAD_BRANCH advanced from $HEAD_SHA to $current_branch_sha during preview; skipping stale merge." >&2
            exit 0
          fi

          if git -C merge-repo merge-base --is-ancestor "origin/$BASE_BRANCH" "$HEAD_SHA"; then
            git -C merge-repo checkout "$BASE_BRANCH"
            git -C merge-repo reset --hard "origin/$BASE_BRANCH"
            git -C merge-repo merge --ff-only "$HEAD_SHA"
            git -C merge-repo push origin "$BASE_BRANCH"
            sleep 3
            git -C merge-repo push origin --delete "$HEAD_BRANCH" || true
            echo "Merged blog-only PR #$PR_NUMBER ($HEAD_SHA) into $BASE_BRANCH." >> "$GITHUB_STEP_SUMMARY"
          else
            git -C merge-repo config --local user.name "github-actions[bot]"
            git -C merge-repo config --local user.email "github-actions[bot]@users.noreply.github.com"
            git -C merge-repo checkout -B "$HEAD_BRANCH" "$HEAD_SHA"
            git -C merge-repo rebase "origin/$BASE_BRANCH"
            git -C merge-repo push --force-with-lease origin "HEAD:$HEAD_BRANCH"
            echo "Rebased $HEAD_BRANCH onto latest $BASE_BRANCH; fresh CI will complete auto-merge." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Require maintainer approval for People updates
        if: steps.pr.outputs.found == 'true' && steps.policy.outputs.eligible == 'true' && steps.policy.outputs.has_people == 'true'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          pr_author="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json author --jq '.author.login // empty')"
          if [[ "$pr_author" != "manhkhanhad" ]]; then
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-reviewer manhkhanhad || true
          fi
          if [[ -n "$APP_TOKEN" ]]; then
            gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash --match-head-commit "$HEAD_SHA"
          fi
          {
            echo "### Keystatic preview deployed (awaiting People approval)"
            echo "- PR #$PR_NUMBER touches People records and requires **1 approval** (@manhkhanhad) before squash-merging."
          } >> "$GITHUB_STEP_SUMMARY"
